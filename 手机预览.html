<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>兵子装修台 · 手机预览</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
                   "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      background: linear-gradient(135deg, #F6EBD2, #E6D6B4);
      display: flex; flex-direction: column; align-items: center;
      gap: 14px; padding: 20px; min-height: 100vh;
    }
    .topbar-prev {
      display: flex; align-items: center; gap: 10px; flex-wrap: wrap; justify-content: center;
      background: #fff; padding: 8px 14px; border-radius: 14px;
      box-shadow: 0 8px 24px rgba(160, 120, 40, .15);
    }
    .topbar-prev .title { font-weight: 700; color: #3D352A; margin-right: 6px; display: inline-flex; align-items: center; gap: 6px; }
    .topbar-prev .title svg { width: 18px; height: 18px; }
    .seg { display: flex; background: #F3EDE0; border-radius: 10px; padding: 3px; gap: 3px; }
    .seg button {
      border: none; background: transparent; padding: 6px 14px; border-radius: 8px;
      font-size: 13px; cursor: pointer; color: #8A7F6A; font-family: inherit;
      display: inline-flex; align-items: center; gap: 5px;
      transition: background .15s, color .15s;
    }
    .seg button svg { width: 15px; height: 15px; }
    .seg button:hover { color: #3D352A; }
    .seg button.active { background: #F5C542; color: #3D352A; font-weight: 600; }
    .prev-btn {
      border: none; background: #F3EDE0; width: 32px; height: 32px; border-radius: 8px;
      display: inline-flex; align-items: center; justify-content: center;
      font-size: 15px; cursor: pointer; transition: background .15s;
    }
    .prev-btn svg { width: 16px; height: 16px; }
    .prev-btn:hover { background: #E7DDBE; }
    .viewport-info { font-size: 12px; color: #8A7F6A; }

    .frame {
      position: relative;
      background: #1c1c1e; border-radius: 46px; padding: 14px;
      box-shadow: 0 24px 70px rgba(0, 0, 0, .35);
      transition: width .35s ease, height .35s ease, border-radius .35s;
    }
    .frame.phone {
      width: 390px;
      height: min(820px, calc(100vh - 150px));
    }
    .frame.full {
      width: calc(100vw - 56px);
      height: calc(100vh - 120px);
      border-radius: 18px; padding: 10px;
    }
    .frame iframe {
      display: block; width: 100%; height: 100%; border: none;
      border-radius: 34px; background: #FFF9EC;
    }
    .frame.full iframe { border-radius: 10px; }

    @media (max-width: 440px) {
      body { padding: 10px; gap: 10px; }
      .frame.phone {
        width: 100%;
        height: calc(100vh - 116px);
        border-radius: 26px; padding: 8px;
      }
      .frame.phone iframe { border-radius: 18px; }
    }
  </style>
</head>
<body>

  <div class="topbar-prev">
    <span class="title"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" width="24" height="24"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><path d="M9 22V12h6v10"/></svg> 兵子装修台</span>
    <div class="seg" id="segMode">
      <button id="mPhone" class="active"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" width="24" height="24"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.127.96.361 1.903.7 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.907.339 1.85.573 2.81.7A2 2 0 0 1 22 16.92Z"/></svg> 手机</button>
      <button id="mFull"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" width="24" height="24"><rect x="2" y="3" width="20" height="14" rx="2"/><path d="M8 21h8M12 17v4"/></svg> 全屏</button>
    </div>
    <button class="prev-btn" id="mReload" title="刷新应用"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" width="24" height="24"><path d="M21 12a9 9 0 1 1-9-9c2.52 0 4.93 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/></svg></button>
    <span class="viewport-info" id="info">390 × 844 · 手机视口</span>
  </div>

  <div class="frame phone" id="frame">
    <iframe id="app" src="index.html" title="兵子装修台"></iframe>
  </div>

  <script>
    var frame = document.getElementById('frame');
    var appFrame = document.getElementById('app');
    var info = document.getElementById('info');

    function setMode(mode) {
      var phone = document.getElementById('mPhone');
      var full = document.getElementById('mFull');
      if (mode === 'phone') {
        frame.className = 'frame phone';
        phone.classList.add('active'); full.classList.remove('active');
        info.textContent = '390 × 844 · 手机视口';
      } else {
        frame.className = 'frame full';
        full.classList.add('active'); phone.classList.remove('active');
        info.textContent = '自适应 · 桌面视口';
      }
    }

    document.getElementById('mPhone').addEventListener('click', function () { setMode('phone'); });
    document.getElementById('mFull').addEventListener('click', function () { setMode('full'); });
    document.getElementById('mReload').addEventListener('click', function () {
      appFrame.contentWindow.location.reload();
    });
  </script>
</body>
</html>
